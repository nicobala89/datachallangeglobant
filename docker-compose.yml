x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    _PIP_ADDITIONAL_REQUIREMENTS: 'fastavro>=1.9.4 pydantic>=2.5.0 psycopg2-binary>=2.9.9 dbt-core>=1.7.0 dbt-postgres>=1.7.0 pyarrow>=15.0.0 pandas>=2.2.0'
    PYTHONPATH: /opt/airflow
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    BACKUP_DIR: /opt/airflow/backups
  volumes: &airflow-volumes
    - ./airflow/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./processing:/opt/airflow/processing
    - ./quality:/opt/airflow/quality
    - ./catalog:/opt/airflow/catalog
    - ./data:/opt/airflow/data           # data/csv + data/bronze
    - ./backups:/opt/airflow/backups
    - ./dbt:/opt/airflow/dbt
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
  networks:
    - globant-network

services:
  # PostgreSQL - Analytics Serving Layer
  postgres:
    image: postgres:15-alpine
    container_name: globant-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globant-network

  # FastAPI - REST API + Upload UI
  fastapi:
    build: .
    container_name: globant-fastapi
    command: uvicorn catalog.api.catalog_api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_KEY: ${API_KEY}
      BACKUP_DIR: /app/backups
      BRONZE_DIR: /app/data/bronze
      METABASE_URL: http://metabase:3000
      METABASE_PUBLIC_URL: ${METABASE_PUBLIC_URL:-http://localhost:3000}
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD}
      AIRFLOW_URL: http://airflow-webserver:8080
      AIRFLOW_PUBLIC_URL: ${AIRFLOW_PUBLIC_URL:-http://localhost:8080}
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    volumes:
      - ./backups:/app/backups
      - ./data:/app/data           # includes data/csv and data/bronze
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - globant-network

  # Apache Airflow - DB Init (runs once, then exits)
  airflow-init:
    <<: *airflow-common
    container_name: globant-airflow-init
    command: bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USERNAME} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL} || true"
    restart: "no"

  # Apache Airflow - Orchestration
  airflow-webserver:
    <<: *airflow-common
    container_name: globant-airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: globant-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  # Metabase - Reporting & BI
  metabase:
    image: metabase/metabase:latest
    container_name: globant-metabase
    depends_on:
      - postgres
    environment:
      # Metabase stores its own metadata in an embedded H2 DB (simple for PoC)
      # At scale: point MB_DB_* to a dedicated postgres schema
      MB_DB_TYPE: h2
      JAVA_TIMEZONE: UTC
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - globant-network

  # Metabase Init - configures DB connection + dashboards on first boot
  metabase-init:
    build: .
    container_name: globant-metabase-init
    command: python scripts/metabase_setup.py
    environment:
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      metabase:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - globant-network

networks:
  globant-network:
    driver: bridge

volumes:
  postgres_data:
  airflow_logs:
  metabase_data:
