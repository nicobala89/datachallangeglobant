# File Connector Configuration Example

# Path to the file (local or cloud)
path: "/data/source/sales_data.csv"

# Storage type: local, s3, gcs, azure
storage_type: local

# Expected file format (optional, will be auto-detected if not specified)
expected_format: csv

# Cloud storage credentials (only needed for cloud storage)
# credentials:
#   aws_access_key_id: "${AWS_ACCESS_KEY}"
#   aws_secret_access_key: "${AWS_SECRET_KEY}"
#   region: us-east-1
